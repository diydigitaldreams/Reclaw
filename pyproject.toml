[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reclaw"
version = "0.1.0"
description = "Out-of-band recovery engine for OpenClaw workspaces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "JP", email = "jean@diydigitaldreams.com" },
]
keywords = ["openclaw", "recovery", "ai-agent", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Recovery Tools",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
reclaw = "reclaw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reclaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
